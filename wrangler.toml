# AI Task Pages — isolated from AI Jobs Market (aijobsmarket2 / aijobsmarket_db).
# Never point this project at aijobsmarket2, aijobsmarket_db, or aijobsmarket-images.
name = "aitaskpages"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
# Run the worker first for app routes so static public/*.html does not shadow Next.js pages.
run_worker_first = [
  "/",
  "/experts",
  "/experts/*",
  "/freelancers",
  "/freelancers/*",
  "/search",
  "/join-as-expert",
  "/create-a-profile",
  "/dashboard",
  "/dashboard/*",
  "/account/setup",
  "/tasks",
  "/tasks/*",
  "/sign-in",
  "/sign-in/*",
  "/sign-up",
  "/sign-up/*",
  "/__clerk/*",
  "/api/*",
  "/about",
  "/privacy",
  "/terms",
  "/cookies",
  "/disclaimer",
  "/acceptable-use",
  "/expert-terms",
  "/unsubscribe",
  "/coming-soon",
  "/sitemap.xml",
  "/robots.txt",
  # Dynamic brand assets & favicons served live from R2 with ETag revalidation
  "/favicon.ico",
  "/favicon.svg",
  "/favicon-16x16.png",
  "/favicon-32x32.png",
  "/favicon-48x48.png",
  "/favicon-96x96.png",
  "/favicon-144x144.png",
  "/favicon-192x192.png",
  "/favicon-512x512.png",
  "/apple-touch-icon.png",
  "/site.webmanifest",
  "/brand/*",
]

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "aitaskpages"

[[d1_databases]]
binding = "DB"
database_name = "aitaskpages_db"
database_id = "cce6e833-e0d6-4e52-968d-c4363a5b741f"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "aitaskpages-images"

[vars]
# Public base URL for images served from R2 (set custom domain/CDN when ready).
# Until a CDN domain exists, leave empty or set after R2 custom domain is configured.
IMAGES_BASE_URL = ""
# Clerk publishable key — set after creating a NEW Clerk app for AI Task Pages.
# Do not reuse AI Jobs Market Clerk keys.
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuYWl0YXNrcGFnZXMuY29tJA"
NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/sign-in"
NEXT_PUBLIC_CLERK_SIGN_UP_URL = "/sign-up"
NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL = "/dashboard"
NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL = "/dashboard"
# Resend from-address — aitaskpages.com must be verified in Resend.
EMAIL_FROM = "AI Task Pages <notify@aitaskpages.com>"
MARKETING_EMAIL_FROM = "AI Task Pages <notify@aitaskpages.com>"
# Hide the unfinished public site behind a coming-soon cover.
# Set to "0" and redeploy when branding/content are ready to go live.
COMING_SOON = "1"
# Unlock the real site with ?preview=… then ?preview=off to cover it again.
COMING_SOON_BYPASS = "tp-dev-cover-7m9q"

# Local development secrets go in .dev.vars:
# CLERK_SECRET_KEY=
# CLERK_ENCRYPTION_KEY=   # openssl rand -hex 32 — needed for dynamic Clerk middleware keys
# CLERK_WEBHOOK_SIGNING_SECRET=
# RESEND_API_KEY=
# ADMIN_API_KEY=
# MARKETING_UNSUBSCRIBE_SECRET=
# TURNSTILE_SECRET_KEY=
# NEXT_PUBLIC_TURNSTILE_SITE_KEY=  (set in .env.local for next dev)
#
# Production secrets (Cloudflare Worker Versions API):
#   1. npm run deploy
#   2. npm run secret:put / secret:put:webhook / secret:put:encryption / secret:put:resend
#      (NOT wrangler secret put — that fails while a version is pending)
#   3. npm run deploy       (promote the version that includes the secret)
