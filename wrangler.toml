name = "aijobsmarket2"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
# Run the worker first for app routes so static public/*.html does not shadow Next.js pages.
run_worker_first = [
  "/",
  "/freelancers",
  "/freelancers/*",
  "/join-as-expert",
  "/dashboard",
  "/dashboard/*",
  "/sign-in",
  "/sign-in/*",
  "/sign-up",
  "/sign-up/*",
  "/__clerk/*",
]

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "aijobsmarket2"

[[d1_databases]]
binding = "DB"
database_name = "aijobsmarket_db"
database_id = "3f306411-f30c-4593-8cc4-37f798e752e5"

[vars]
# Public Clerk key (safe to commit — it is exposed in the browser anyway)
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_aG9uZXN0LW1hY2tlcmVsLTgzLmNsZXJrLmFjY291bnRzLmRldiQ"
NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/sign-in"
NEXT_PUBLIC_CLERK_SIGN_UP_URL = "/sign-up"
NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL = "/dashboard"
NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL = "/dashboard"

# Local development secrets go in .dev.vars:
# CLERK_SECRET_KEY=
# RESEND_API_KEY=
# TURNSTILE_SECRET_KEY=
# NEXT_PUBLIC_TURNSTILE_SITE_KEY=  (set in .env.local for next dev)
#
# Production secrets (Cloudflare Worker Versions API):
#   1. npm run deploy
#   2. npm run secret:put   (NOT wrangler secret put — that fails while a version is pending)
#   3. npm run deploy       (promote the version that includes the secret)
