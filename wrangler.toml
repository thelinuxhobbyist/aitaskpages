# Production Worker for aijobsmarket.co.uk / aijobsmarket.uk.
# Do not rename, and do not "Create application" from this GitHub repo again —
# that creates a duplicate Worker. Open the existing aijobsmarket2 app instead.
name = "aijobsmarket2"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
# Run the worker first for app routes so static public/*.html does not shadow Next.js pages.
run_worker_first = [
  "/",
  "/experts",
  "/experts/*",
  "/freelancers",
  "/freelancers/*",
  "/search",
  "/join-as-expert",
  "/create-a-profile",
  "/dashboard",
  "/dashboard/*",
  "/account/setup",
  "/tasks",
  "/tasks/*",
  "/sign-in",
  "/sign-in/*",
  "/sign-up",
  "/sign-up/*",
  "/__clerk/*",
  "/api/*",
  "/about",
  "/privacy",
  "/terms",
  "/cookies",
  "/disclaimer",
  "/acceptable-use",
  "/expert-terms",
  "/unsubscribe",
  "/sitemap.xml",
  "/robots.txt",
  # Google Search Console HTML verification file — must 200 at the exact .html URL
  # (Cloudflare asset html_handling otherwise 307s /file.html → /file).
  "/google8f644ce488bcdd77.html",
  # Dynamic brand assets & favicons served live from R2 with ETag revalidation
  "/favicon.ico",
  "/favicon.svg",
  "/favicon-16x16.png",
  "/favicon-32x32.png",
  "/favicon-48x48.png",
  "/favicon-96x96.png",
  "/favicon-144x144.png",
  "/favicon-192x192.png",
  "/favicon-512x512.png",
  "/apple-touch-icon.png",
  "/site.webmanifest",
  "/brand/*",
]

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "aijobsmarket2"

[[d1_databases]]
binding = "DB"
database_name = "aijobsmarket_db"
database_id = "3f306411-f30c-4593-8cc4-37f798e752e5"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "aijobsmarket-images"

[vars]
# Public base URL for images served from the R2 bucket's custom domain.
IMAGES_BASE_URL = "https://cdn.aijobsmarket.co.uk"
# Public Clerk key (safe to commit — it is exposed in the browser anyway)
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuYWlqb2JzbWFya2V0LmNvLnVrJA"
NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/sign-in"
NEXT_PUBLIC_CLERK_SIGN_UP_URL = "/sign-up"
NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL = "/dashboard"
NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL = "/dashboard"

# Local development secrets go in .dev.vars:
# CLERK_SECRET_KEY=
# CLERK_WEBHOOK_SIGNING_SECRET=
# RESEND_API_KEY=
# ADMIN_API_KEY=
# MARKETING_UNSUBSCRIBE_SECRET=
# TURNSTILE_SECRET_KEY=
# NEXT_PUBLIC_TURNSTILE_SITE_KEY=  (set in .env.local for next dev)
#
# Production secrets (Cloudflare Worker Versions API):
#   1. npm run deploy
#   2. npm run secret:put   (NOT wrangler secret put — that fails while a version is pending)
#   3. npm run deploy       (promote the version that includes the secret)
