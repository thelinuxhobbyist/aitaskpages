<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Market UK | Discover Your Next Role</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N3EBLR665X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-N3EBLR665X');
    </script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>AI Job Market <span>UK</span></h1>
            <p>Curated AI, Machine Learning & Data Science roles</p>
        </div>
    </header>

    <section class="controls">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search by title, company, or tech..." onkeyup="handleSearch()">
        </div>
        
        <div class="filters-container">
            <div class="filter-group">
                <label for="skillLevelFilter">Skill Level:</label>
                <select id="skillLevelFilter" onchange="handleFilterChange()">
                    <option value="">All Levels</option>
                    <option value="junior">Junior</option>
                    <option value="mid">Mid-Level</option>
                    <option value="senior">Senior</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="remoteFilter">Remote:</label>
                <select id="remoteFilter" onchange="handleFilterChange()">
                    <option value="">All Types</option>
                    <option value="remote">Remote</option>
                    <option value="hybrid">Hybrid</option>
                    <option value="office">Office</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="salaryFilter">Salary Range:</label>
                <select id="salaryFilter" onchange="handleFilterChange()">
                    <option value="">All Ranges</option>
                    <option value="0-50000">£0 - £50k</option>
                    <option value="50000-75000">£50k - £75k</option>
                    <option value="75000-100000">£75k - £100k</option>
                    <option value="100000+">£100k+</option>
                </select>
            </div>
        </div>
        
        <div id="status-bar">
            <span id="job-count">Loading jobs...</span>
        </div>
    </section>

    <main id="job-container">
        <div class="loader">
            <div class="spinner"></div>
            <p>Fetching the latest AI opportunities...</p>
        </div>
    </main>

    <div class="pagination" id="pagination-controls">
        <button id="prevBtn" onclick="changePage(-1)" disabled>← Previous</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn" onclick="changePage(1)">Next →</button>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> AI Job Market UK. Data aggregated from multiple job providers.</p>
        <div class="footer-links">
            <a href="about.html">About</a>
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms-of-use.html">Terms of Use</a>
        </div>
    </footer>

    <script>
        const WORKER_URL = "https://holy-sky-9d35.yama.workers.dev";
        let allJobs = [];
        let filteredJobs = [];
        let currentPage = 1;
        const jobsPerPage = 10;

        function truncateDescription(text, maxLength = 150) {
            if (text.length <= maxLength) return text;
            
            // Truncate to max length
            let truncated = text.substring(0, maxLength);
            
            // Try to find the end of a sentence (period followed by space)
            let lastPeriod = truncated.lastIndexOf('. ');
            if (lastPeriod > maxLength * 0.6) {
                return truncated.substring(0, lastPeriod + 1);
            }
            
            // Otherwise, find the last word boundary
            let lastSpace = truncated.lastIndexOf(' ');
            if (lastSpace > 0) {
                return truncated.substring(0, lastSpace);
            }
            
            return truncated;
        }

        function detectSkillLevel(jobTitle, description) {
            const text = `${jobTitle} ${description}`.toLowerCase();
            
            if (text.includes('senior') || text.includes('lead') || text.includes('principal') || text.includes('staff')) {
                return 'senior';
            }
            if (text.includes('junior') || text.includes('graduate') || text.includes('entry')) {
                return 'junior';
            }
            if (text.includes('mid') || text.includes('intermediate') || text.includes('mid-level')) {
                return 'mid';
            }
            
            return 'mid'; // default to mid-level
        }

        function detectRemoteType(locationName, description) {
            const text = `${locationName} ${description}`.toLowerCase();
            
            if (text.includes('remote')) {
                return 'remote';
            }
            if (text.includes('hybrid')) {
                return 'hybrid';
            }
            
            return 'office';
        }

        function applyFilters() {
            fetchJobsWithFilters();
        }

        function handleFilterChange() {
            applyFilters();
        }

        async function fetchJobsWithFilters() {
            try {
                const searchQuery = document.getElementById('searchInput').value || '';
                const skillLevel = document.getElementById('skillLevelFilter').value || '';
                const remoteType = document.getElementById('remoteFilter').value || '';
                const salaryRange = document.getElementById('salaryFilter').value || '';
                
                // Build query string with filter parameters
                const params = new URLSearchParams();
                if (searchQuery) params.append('search', searchQuery);
                if (skillLevel) params.append('skillLevel', skillLevel);
                if (remoteType) params.append('remote', remoteType);
                if (salaryRange) params.append('salaryRange', salaryRange);
                
                const url = params.toString() ? `${WORKER_URL}?${params.toString()}` : WORKER_URL;
                const response = await fetch(url);
                const data = await response.json();
                allJobs = data.results || [];
                filteredJobs = [...allJobs];
                currentPage = 1;
                updateUI();
            } catch (e) {
                document.getElementById('job-container').innerHTML = 
                    `<div class="error-msg">Failed to connect to the market. Please refresh the page.</div>`;
            }
        }

        function applyClientSideFilters() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const skillLevel = document.getElementById('skillLevelFilter').value;
            const remoteType = document.getElementById('remoteFilter').value;
            const salaryRange = document.getElementById('salaryFilter').value;
            
            filteredJobs = allJobs.filter(job => {
                // Search filter
                const matchesSearch = !searchQuery || (
                    job.jobTitle.toLowerCase().includes(searchQuery) || 
                    job.employerName.toLowerCase().includes(searchQuery) ||
                    job.locationName.toLowerCase().includes(searchQuery)
                );
                
                // Skill level filter
                const jobSkillLevel = detectSkillLevel(job.jobTitle, job.jobDescription);
                const matchesSkillLevel = !skillLevel || jobSkillLevel === skillLevel;
                
                // Remote filter
                const jobRemoteType = detectRemoteType(job.locationName, job.jobDescription);
                const matchesRemote = !remoteType || jobRemoteType === remoteType;
                
                // Salary filter
                let matchesSalary = true;
                if (salaryRange) {
                    const minSalary = job.minimumSalary || 0;
                    if (salaryRange === '0-50000') {
                        matchesSalary = minSalary <= 50000;
                    } else if (salaryRange === '50000-75000') {
                        matchesSalary = minSalary >= 50000 && minSalary <= 75000;
                    } else if (salaryRange === '75000-100000') {
                        matchesSalary = minSalary >= 75000 && minSalary <= 100000;
                    } else if (salaryRange === '100000+') {
                        matchesSalary = minSalary >= 100000;
                    }
                }
                
                return matchesSearch && matchesSkillLevel && matchesRemote && matchesSalary;
            });
            
            currentPage = 1;
            updateUI();
        }

        async function init() {
            await fetchJobsWithFilters();
        }

        function handleSearch() {
            applyFilters();
        }

        function updateUI() {
            const container = document.getElementById('job-container');
            const start = (currentPage - 1) * jobsPerPage;
            const end = start + jobsPerPage;
            const pageItems = filteredJobs.slice(start, end);

            document.getElementById('job-count').innerText = `${filteredJobs.length} roles found`;
            
            if (pageItems.length === 0) {
                container.innerHTML = `<div class="no-results">No matching jobs found. Try a different search!</div>`;
                document.getElementById('pagination-controls').style.display = 'none';
                return;
            }

            document.getElementById('pagination-controls').style.display = 'flex';
            container.innerHTML = '';
            
            pageItems.forEach(job => {
                const salary = job.minimumSalary ? `£${job.minimumSalary.toLocaleString()} - £${job.maximumSalary.toLocaleString()}` : "Salary Competitive";
                const date = job.date ? job.date : "Recent";
                const skillLevel = detectSkillLevel(job.jobTitle, job.jobDescription);
                const skillLevelDisplay = skillLevel.charAt(0).toUpperCase() + skillLevel.slice(1);

                container.innerHTML += `
                    <div class="job-card">
                        <div class="card-top">
                            <span class="date-badge">${date}</span>
                            <span class="skill-badge skill-${skillLevel}">${skillLevelDisplay}</span>
                            <h3>${job.jobTitle}</h3>
                        </div>
                        <div class="job-info">
                            <span><i class="material-icons-outlined">business</i> ${job.employerName}</span>
                            <span><i class="material-icons-outlined">location_on</i> ${job.locationName}</span>
                            <span class="salary-text"><i class="material-icons-outlined">currency_pound</i> ${salary}</span>
                        </div>
                        <div class="snippet">
                            ${truncateDescription(job.jobDescription)}
                        </div>
                        <a href="${job.jobUrl}" target="_blank" class="apply-btn">View & Apply</a>
                    </div>
                `;
            });

            document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${Math.ceil(filteredJobs.length / jobsPerPage)}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = end >= filteredJobs.length;
        }

        function changePage(step) {
            currentPage += step;
            updateUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('year').textContent = new Date().getFullYear();
        init();
    </script>
</body>
</html>
