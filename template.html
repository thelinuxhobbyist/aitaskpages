<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title | AI Job Market UK</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N3EBLR665X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-N3EBLR665X');
    </script>
</head>
<body>
    <header>
        <div class="header-content">
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                <span class="material-icons-outlined">menu</span>
            </button>
            <h1>AI Job Market <span>UK</span></h1>
            <p>Curated AI, Machine Learning & Data Science roles</p>
        </div>
        <nav class="mobile-nav" id="mobileNav">
            <a href="index.html" class="nav-link">
                <span class="material-icons-outlined">home</span>
                <span>Home</span>
            </a>
            <a href="about.html" class="nav-link">
                <span class="material-icons-outlined">info</span>
                <span>About</span>
            </a>
            <a href="privacy-policy.html" class="nav-link">
                <span class="material-icons-outlined">privacy_tip</span>
                <span>Privacy</span>
            </a>
            <a href="terms-of-use.html" class="nav-link">
                <span class="material-icons-outlined">description</span>
                <span>Terms</span>
            </a>
        </nav>
    </header>
    <!-- Add your page content here -->
    
    <script>
        // Mobile menu toggle
        const menuToggle = document.getElementById('menuToggle');
        const mobileNav = document.getElementById('mobileNav');
        
        menuToggle.addEventListener('click', function() {
            mobileNav.classList.toggle('active');
            menuToggle.classList.toggle('active');
        });
        
        // Close menu when a link is clicked
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function() {
                mobileNav.classList.remove('active');
                menuToggle.classList.remove('active');
            });
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('header')) {
                mobileNav.classList.remove('active');
                menuToggle.classList.remove('active');
            }
        });
    </script>
</body>
</html>
